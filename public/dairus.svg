<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2550"/>
      <stop offset="0.55" stop-color="#061426"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tendencia" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00d395"/>
      <stop offset="1" stop-color="#00f0c0"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c96ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="18" result="desfoque"/>
      <feMerge>
        <feMergeNode in="desfoque"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base: quadrado arredondado escuro com brilho azul -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#fundo)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#brilho)"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="none" stroke="url(#borda)" stroke-width="10" opacity="0.7"/>

  <!-- Letra D em neon -->
  <path d="M300 250 H470 C680 250 790 372 790 512 C790 652 680 774 470 774 H300 Z"
        fill="none" stroke="url(#letra)" stroke-width="104" stroke-linejoin="round" filter="url(#neon)"/>

  <!-- Linha de crescimento dentro do D -->
  <polyline points="390,628 478,540 548,598 652,470"
            fill="none" stroke="url(#tendencia)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <path d="M598 452 L676 446 L670 524 Z" fill="#00f0c0" stroke="#00f0c0" stroke-width="26" stroke-linejoin="round" filter="url(#neon)"/>
</svg>
