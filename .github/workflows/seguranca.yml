name: Segurança

# Procura vulnerabilidades conhecidas nas bibliotecas (npm e Rust) e segredos
# vazados no código. Roda em pull requests, em pushes na main e todo dia (bibliotecas
# ganham alertas novos mesmo sem o código mudar).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  npm:
    name: Bibliotecas do app (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Falha só com gravidade alta/crítica nas bibliotecas que vão no app.
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: Bibliotecas do motor (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Binário pronto (segundos), em vez de compilar o cargo-audit do zero a cada execução.
      # Ele só lê o Cargo.lock e o src-tauri/.cargo/audit.toml; não compila o app, então
      # não há cache de compilação (Swatinem/rust-cache) para aproveitar aqui.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  segredos:
    name: Segredos no código (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
